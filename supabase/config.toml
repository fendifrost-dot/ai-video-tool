project_id = "qoyxgnkvjukovkrvdaiq"

# compose-look-callback is a server-to-server endpoint: CC POSTs the
# rendered pipeline result here after running the async pipeline. There is
# no user JWT to validate at the edge — authentication happens inside the
# function via the X-Proxy-Secret header (shared with CC). Mark it public
# so Supabase doesn't reject CC's requests at the platform layer.
[functions.compose-look-callback]
verify_jwt = false

# faceswap-callback is a server-to-server webhook from CC (which subscribed to
# Fal's webhook for the async face-swap job). Same auth model as
# compose-look-callback: shared X-Proxy-Secret validated inside the function.
[functions.faceswap-callback]
verify_jwt = false

[functions.train-style-lora-proxy]
verify_jwt = false

[functions.train-style-lora-callback]
verify_jwt = false

# Hero Frame Grok garment-truth — user JWT required (browser calls with session token).
[functions.grok-image-garment-proxy]
verify_jwt = true

# Phase 1 Voice Director — STT / Grok text phrasing / TTS. User JWT required.
# Read-only; no Imagine/video. See docs/ux/brief_for_chatgpt_voice_director.md.
[functions.grok-voice-director-proxy]
verify_jwt = true

# Resolution verification harness (not a product lane). Runs server-side with
# the service-role key so it needs no browser session — hence verify_jwt = false.
# It authenticates itself by requiring the service-role key as the bearer token.
[functions.grok-resolution-test]
verify_jwt = false

# Grok 2026 Capability Re-Benchmark harness (RESEARCH ONLY, not a product lane).
# Referenced by nothing; exists because no AVT/CC path can POST /v1/videos/edits.
# Same posture as grok-resolution-test: no browser session, anon or service-role
# key as bearer. Delete once the re-benchmark verdict is recorded.
# See docs/research/GROK_RECAP_2026-08_PHASE0_PHASE1.md.
[functions.grok-video-research-proxy]
verify_jwt = false

# Architecture C product lane — Grok /v1/videos/edits with user JWT.
[functions.grok-video-edit-proxy]
verify_jwt = true

# Architecture C still-first deterministic repair (logo_chest / sleeve_panel).
# User JWT required. No xAI spend. Temporal tracking remains disabled in-code.
[functions.architecture-c-still-repair-proxy]
verify_jwt = true

# Jacket-only masked inpaint (locked v2 wardrobe-swap primary lane). Routes Fal
# through Control Center via X-Proxy-Secret (same secrets as wardrobe-vton-proxy);
# user JWT required (browser calls with session token).
# See docs/AVT_Wardrobe_Swap_Build_Spec_v2.md §4.
[functions.jacket-inpaint-proxy]
verify_jwt = true

# SAM-3 masking only (CC switchx-restyle segment-image). User JWT required.
[functions.sam3-segment-proxy]
verify_jwt = true

# Scrub-proxy transcode dispatcher. The browser calls it after a video upload
# with the session token; it routes the ~720p H.264 transcode through Control
# Center via X-Proxy-Secret (same secrets as wardrobe-vton-proxy) and writes the
# proxy pointer onto the master asset's metadata_json. User JWT required.
[functions.make-scrub-proxy-proxy]
verify_jwt = true

# Wardrobe video propagation — Phase 2a encoder roundtrip. Reassembles an
# ordered frame set (client-extracted) back into a clip via Fal
# `ffmpeg-api/compose`, routed through Control Center via X-Proxy-Secret (same
# secrets as wardrobe-vton-proxy). Needs VIDEO_COMPOSE_FAL_MODEL. User JWT
# required. See docs/AVT_Wardrobe_Swap_Build_Spec_v2.md §7.
[functions.wardrobe-video-reassemble-proxy]
verify_jwt = true

# Wardrobe video frame extraction — GENERIC server-side shot/frame service. The
# browser calls it with the session token to seek+trim a [start,duration] clip
# out of a (possibly ~2 GB 4K HEVC) master and extract its frames on Fal ffmpeg,
# routed through Control Center via X-Proxy-Secret (same secrets as
# wardrobe-vton-proxy). Needs CLIP_TRIM_FAL_MODEL + FRAME_EXTRACT_FAL_MODEL.
# Idempotent + resumable; writes an extraction manifest onto the master asset's
# metadata_json. User JWT required. See supabase/functions/_shared/frameExtract.ts.
[functions.wardrobe-video-frame-extract-proxy]
verify_jwt = true

# Wardrobe video propagation — Phase 2b per-frame garment swap. Reference-locks
# one approved garment image onto every extracted frame via CC switchx-restyle
# (vton-frame action by default, or fal-run FRAME_SWAP_FAL_MODEL), then the
# swapped frames feed wardrobe-video-reassemble-proxy. User JWT required.
# See docs/AVT_masked_garment_swap_LOCKED.md.
[functions.wardrobe-video-swap-proxy]
verify_jwt = true
