# The check that would have caught the broken lockfile.
#
# WHY THIS EXISTS (9 Oct 2026)
#   `npm ci` was impossible on main: package.json declared drizzle-kit, drizzle-orm, postgres and the
#   @tanstack/devtools family that package-lock.json had never heard of, plus four packages pinned below the
#   range package.json asked for. The cause is visible in the history — the last three commits to touch
#   package.json are all `gpt-engineer-app[bot]` "Work in progress", and none of them touched the lockfile. So
#   every Lovable change that adds a dependency desyncs the lock, and nothing noticed until someone tried a
#   clean install.
#
#   `npm ci` IS the reproducibility check. It refuses to run when package.json and the lockfile disagree, which
#   is precisely the failure. Deliberately NOT used: regenerating the lock and asserting no diff. That looks
#   stricter but goes red whenever an upstream package publishes a patch inside an existing range — a false
#   failure with nothing for anyone to fix.
#
# Lint is deliberately absent: the repo carries known prettier/lint debt, and a gate that is red on arrival
# teaches people to ignore it. Add it when the debt is paid, not before.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Lovable bundles a function folder plus _shared only. This does not need node_modules.
      - name: Edge imports stay in the function folder or _shared
        run: node scripts/check-edge-imports.mjs

      # The gate. A package.json change merged without regenerating the lockfile fails HERE, with npm naming
      # every package that is missing or out of range.
      - name: Clean install from the lockfile (reproducibility gate)
        run: npm ci --no-audit --no-fund

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      # The structural proxy test encodes with ffmpeg. ubuntu-latest does not ship it.
      # Plan assertions still run when the binaries are absent (it.skipIf on the encode).
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Tests
        run: npm test

  # The put-back scripts' segmenter flag (scripts/edit/segmenters.py): SAM 3 behind --segmenter, MediaPipe the default.
  # These tests run the scripts under a stub `mediapipe` on a synthetic clip, with no weights, no network, no GPU, and
  # prove the default path is byte-identical with and without the flag. ffmpeg encodes the fixtures.
  python-segmenters:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install the test deps (numpy, OpenCV, pytest; no ML stack)
        run: python -m pip install --quiet numpy opencv-python-headless pytest

      - name: Segmenter tests
        run: python -m pytest scripts/edit/tests/test_segmenters.py scripts/edit/tests/test_ysl_mask_benchmark.py scripts/edit/tests/test_cli_help.py::test_help_strings_are_percent_safe -q
